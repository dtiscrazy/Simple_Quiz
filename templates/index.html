<!DOCTYPE html>
<html>
<head>
    <title>Quiz</title>
</head>

<body>

    <h1>Simple Quiz</h1>

    <h2>{{ question }}</h2>

    {% for option in options %}
        <p>{{ option }}</p>
    {% endfor %}

    <form method="POST">

        <input type="text" name="answer">

        <button type="submit">
            Submit
        </button>

    </form>

</body>
</html>
